[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mediakeep"
version = "0.1.0"
description = "Tidy movie and TV folders into Jellyfin-friendly names, safely and with undo"
readme = "README.md"
license = "Unlicense"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "pydantic>=2",
  "pyyaml>=6",
  "rich>=13",
  "rapidfuzz>=3",
  "aiohttp>=3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3",
]

[project.urls]
Homepage = "https://github.com/SoMoney/mediakeep"
Issues = "https://github.com/SoMoney/mediakeep/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "mypy>=1.10",
  "types-PyYAML>=6",
]

[project.scripts]
mediakeep = "mediakeep.__main__:main"

[tool.setuptools.packages.find]
include = ["mediakeep*"]

[tool.setuptools.package-data]
mediakeep = ["web/templates/*", "web/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
